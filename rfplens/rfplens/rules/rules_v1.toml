# RFPLens 구조화 규칙 v1
# - 코드 수정 없이 키워드·위계·임계값을 조정하기 위한 파일
# - 정규식은 TOML 리터럴 문자열('...')로 적으며, 배열은 '|'로 이어 하나의 정규식이 된다
# - 규칙을 바꾸면 version을 올리고, 저장소(store)에는 버전별 폴더로 결과를 보존한다
# 기원: 2025년 1월 나라장터 용역 공고 9,536건(1배치) 처리 경험 (docs/설계서.md 참조)

version = "rules-v1"

[text]
table_mark = "│"          # 칸 3개 이상 표의 셀 문단 접두(제목 판별 제외용)

[doctype]                 # 파일명(압축 내부는 내부 파일명) 기준, 위에서부터 먼저 일치하는 유형
order = ["제안요청서", "과업지시서", "공고문"]
"제안요청서" = '제안요청|RFP'
"과업지시서" = '과업'
"공고문" = '공고'
default = "기타"
core = ["과업지시서", "제안요청서"]   # 핵심문서(공고문만 판독 불가 시 통과 판단 기준)

[heading]
key_max = 30              # 제목 핵심어(콜론 앞) 최대 길이
body_max = 60             # 제목 줄 전체 최대 길이
bare_key_max = 12         # 번호·기호 없는 줄을 제목으로 인정할 핵심어 최대 길이(공백 제외)
sentence_end = '(한다|하여야|있다|없다|된다|바람|할것|함)[.\s]*$'
toc_max = 45              # 목차 줄(제목 + 쪽번호) 판별 최대 길이
toc = '(\s|·|…|\.{2,}|-)\s*\d{1,3}\s*$'

# 항목 기호(번호·글머리). 순서대로 이어 하나의 정규식이 된다.
marker = [
  '제\s*\d+\s*[장절조]',
  '[ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+\s*[.)]?', '[IVX]{1,4}\s*[.)]',
  '\d{1,2}\s*[.]\s*\d{1,2}\s*[.]?\s*\d{0,2}[.]?(?=\s)',
  '\d{1,2}\s*[.]', '\(\s*\d{1,2}\s*\)', '\d{1,2}\s*\)',
  '[가-하]\s*[.]', '\(\s*[가-하]\s*\)', '[가-하]\s*\)',
  '[①-⑳]', '[㉠-㉭]', '[a-z]\s*\)',
  '[□■◎●○◇◆▣▶▷►•∙·\-–ㅇ※*❍❏❑➊-➓⑴-⒇]',
  '[-\U000f0000-\U000fffff]',
]

[keywords]                # 제목 핵심어(공백 제거, 콜론 앞) 분류: 행정 > 과업 > 개요 순으로 판정
task = [
  '과업(의)?(내용|범위|세부|수행내용|대상|개요및내용|지시사항)', '세부(과업|내용|지침|사항|업무|요구)',
  '요구사항', '요구기능', '기능요구', '성능요구', '제안요청(내용|사항)',
  '(사업|용역|업무|조사|설계|구축|개발|운영|유지보수|유지관리|점검|측량|연구|수행|작업|용역수행)(의)?(내용|범위|대상|대상범위|항목|방법|지침|기준)',
  '기술(지침|사양|규격|요건)', '수행(내용|방안|업무)', '주요(내용|과업|업무)', '구축범위', '시스템(구성|구축)',
  '(성과품|결과물|산출물|납품물)', '추진내용', '용역이행내용', '사업설명',
]
context = ['(과업|사업|용역)(의)?(목적|개요|배경|필요성|명)', '추진(배경|목적|방향)', '목적$', '개요$', '현황$']
admin = [
  '입찰', '참가자격', '자격요건', '계약', '대가', '지급', '지체', '지연배상', '배상금', '평가', '심사', '배점',
  '제안서(작성|제출|의작성)', '제출서류', '보안', '서약', '착수(계|신고|시)', '용어(의)?정의', '일반사항', '일반조건',
  '준수사항', '유의사항', '분쟁', '책임', '해지', '해제', '하자', '근무', '보험', '안전관리', '기타사항', '기타$',
  '서식', '붙임', '별지', '별첨', '첨부', '부칙', '문의', '담당자', '과업기간', '용역기간', '사업기간', '계약기간',
  '(과업|용역|사업|계약|이행)(의)?기간', '선정(방식|방법|기준)', '협상', '낙찰', '(적용|관련|관계)(규정|법령|법규)',
  '적용법령', '예산', '사업비', '용역비', '지식재산', '저작권', '비밀', '청렴', '인력(투입|관리)', '검수', '변경', '손해',
]
attachment = '^[\[【<(]?\s*(붙임|별지|별첨|별표|서식|첨부)'
constraint = ['참가자격', '입찰참가', '자격요건', '계약방법', '낙찰자(결정|선정)', '계약체결', '공동(수급|도급)', '하도급']

[labels]                  # 구간 모드 → 저장 라벨 (내용은 지우지 않고 라벨만 부여)
TASK = "과업"
NEUTRAL = "일반"
CTX = "개요"
EXCL = "행정"
HARD = "서식·붙임"
NONE = "서두"

[rank]                    # 항목 기호 고정 위계(작을수록 상위). 공문서 관행: Ⅰ > 1. > □ > 가. > ○ > 1) > - > 가) > (1) > ①
default = 8
chap = 0
roman = 0
num_dot = 1
num_sub = 1.2
pua = 1.5
han_dot = 2
num_p = 3
han_p = 4
num_pp = 5
han_pp = 6
circ = 7
circ_han = 7.5
alpha = 8
symbols = { "□" = 1.5, "■" = 1.5, "▣" = 1.5, "❏" = 1.5, "❑" = 1.5, "○" = 2.5, "ㅇ" = 2.5, "◦" = 2.5, "◎" = 2.5, "●" = 2.5, "❍" = 2.5, "-" = 3.5, "–" = 3.5, "·" = 3.5, "∙" = 3.5, "•" = 3.5, "▶" = 3.5, "▷" = 3.5, "►" = 3.5, "◇" = 3.5, "◆" = 3.5, "※" = 9, "*" = 9 }

[units]
min_chars = 15            # 이보다 짧은 단위는 같은 라벨의 직전 단위에 병합
max_chars = 800           # 이보다 긴 단위는 문장 경계로 분할
head_max = 40             # 하위 항목을 가진 제목으로 볼 최대 길이 / 경로 표기 길이
